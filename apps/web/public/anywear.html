<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0A0812" />
    <title>LookSave — Real-time try-on</title>
    <!--
      ⚠️ JSON-LD PRODUCT SCHEMA SHART. Decart Anywear widget'i tugmani
      faqat `isProductPage` true qaytargan sahifada ko'rsatadi
      (anywear.js ichida `<script type="application/ld+json">` ichidagi
      `@type: "Product"` yoki `"ProductGroup"` izlanadi). Schema'ni
      mahsulot bosilganda JavaScript bilan yangilaymiz — Decart
      try-on uchun shu rasmni ishlatadi.
    -->
    <script id="__product_schema" type="application/ld+json">
      {
        "@context": "https://schema.org/",
        "@type": "Product",
        "name": "LookSave Try-on",
        "image": "https://www.looksave.uz/og-tryon.jpg",
        "description": "Real-time try-on — kiyimni kamera orqali ko'ring",
        "sku": "LS-TRYON-DEFAULT",
        "brand": { "@type": "Brand", "name": "LookSave" },
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "UZS",
          "availability": "https://schema.org/InStock"
        }
      }
    </script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #fbf7ff;
        color: #0a0812;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          'Inter',
          system-ui,
          sans-serif;
      }
      body {
        padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
      }
      header {
        padding: 18px 16px 10px;
        text-align: center;
      }
      header h1 {
        margin: 0 0 4px;
        font-size: 22px;
        font-weight: 800;
        color: #0a0812;
        letter-spacing: -0.01em;
      }
      header p {
        margin: 0;
        font-size: 13px;
        color: #6b7280;
      }

      .status {
        margin: 0 16px 10px;
        padding: 10px 14px;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 2px 10px rgba(139, 44, 245, 0.06);
        font-size: 13px;
        color: #6b7280;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .status.ok {
        background: #ecfdf5;
        color: #065f46;
      }
      .status.err {
        background: #fef2f2;
        color: #991b1b;
      }

      .spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid #e9d5ff;
        border-top-color: #8b2cf5;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        flex-shrink: 0;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /*
        ⚠️ IKKI USTUNLI PANJARA. Mobil ekranda (odatiy ishlatuvchi)
        rasm katta ko'rinsin — ikki ustun eng mos: kiyim shakli
        ajralib turadi, scroll kam bo'ladi.
      */
      .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        padding: 10px 16px 120px;
      }
      @media (min-width: 640px) {
        .grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      @media (min-width: 900px) {
        .grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }

      .card {
        position: relative;
        background: #fff;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 4px 16px rgba(10, 8, 18, 0.06);
        display: flex;
        flex-direction: column;
      }
      .card .thumb {
        position: relative;
        aspect-ratio: 3 / 4;
        background: #f3e8ff;
        overflow: hidden;
      }
      .card .thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .card .badge {
        position: absolute;
        top: 8px;
        left: 8px;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 8px;
        background: rgba(139, 44, 245, 0.95);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        border-radius: 999px;
        letter-spacing: 0.02em;
      }
      .card .meta {
        padding: 10px 12px 12px;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .card .title {
        font-size: 13px;
        font-weight: 600;
        color: #0a0812;
        line-height: 1.3;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .card .store {
        font-size: 11px;
        color: #9ca3af;
      }
      .card .price {
        font-size: 14px;
        font-weight: 700;
        color: #8b2cf5;
      }
      .card .cta {
        margin-top: 4px;
        appearance: none;
        border: none;
        background: #0a0812;
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        padding: 10px 12px;
        border-radius: 10px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition:
          background 0.15s ease,
          transform 0.08s ease;
      }
      .card .cta:hover {
        background: #8b2cf5;
      }
      .card .cta:active {
        transform: scale(0.98);
      }
      .card .cta[disabled] {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .empty {
        grid-column: 1 / -1;
        padding: 60px 20px;
        text-align: center;
        color: #9ca3af;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Real-time try-on</h1>
      <p>Mahsulotni tanlang — kamera orqali o'zingizda ko'ring</p>
    </header>

    <div class="status" id="status">
      <span class="spinner" aria-hidden="true"></span>
      <span id="status-text">Widget va mahsulotlar yuklanmoqda…</span>
    </div>

    <div class="grid" id="grid"></div>

    <!--
      Decart Anywear widget. `domain=looksave.uz` — hisobga bog'langan
      domain. Script sahifa yuklanishini to'xtatmaslik uchun `async`.
    -->
    <script
      src="https://anywear.decart.ai/widget/latest/anywear.js?domain=looksave.uz"
      async
    ></script>

    <script>
      (function () {
        'use strict';

        /*
         * ⚠️ API URL — kalit yo'q. `/products` ochiq endpoint, autentifikatsiya
         * talab qilmaydi (katalog web va mobile ikkalasida ishlatiladi).
         * `canTryOn: true` bo'lgan mahsulotlargina try-on uchun yaroqli.
         */
        var API = 'https://api.looksave.uz/v1/products?limit=24';

        var statusEl = document.getElementById('status');
        var statusText = document.getElementById('status-text');
        var grid = document.getElementById('grid');
        var schemaEl = document.getElementById('__product_schema');
        var widgetReady = false;
        var pendingProduct = null;

        function money(price, currency) {
          var n = Number(price);
          if (!isFinite(n)) return '';
          var formatted = n.toLocaleString('uz-UZ');
          return formatted + " so'm";
        }

        function setStatus(cls, text) {
          statusEl.className = 'status ' + (cls || '');
          statusText.textContent = text;
          if (cls === 'ok' || cls === 'err') {
            var sp = statusEl.querySelector('.spinner');
            if (sp) sp.style.display = 'none';
          }
        }

        /*
         * Widget tayyor bo'lguncha kutamiz — `DecartWidget.open()` mavjud
         * bo'lsa ishga tushdi hisoblanadi. Agar foydalanuvchi widget
         * yuklanishdan oldin kartani bossa, pendingProduct'ga saqlab
         * tayyor bo'lgach ochamiz.
         */
        function waitForWidget() {
          var tries = 0;
          var iv = setInterval(function () {
            tries++;
            if (window.DecartWidget && typeof window.DecartWidget.open === 'function') {
              widgetReady = true;
              clearInterval(iv);
              if (pendingProduct) {
                var p = pendingProduct;
                pendingProduct = null;
                openTryOn(p);
              }
            } else if (tries > 60) {
              clearInterval(iv);
              setStatus(
                'err',
                "Widget yuklanmadi. Internet aloqasini tekshiring yoki VPN'ni o'chirib ko'ring.",
              );
            }
          }, 500);
        }

        /*
         * ⚠️ MAHSULOT → JSON-LD → DECART. Decart widget init paytida bir
         * marta `getGarmentMeta`ni chaqirib schema'ni o'qiydi. Biz uning
         * `getGarmentMeta` sozlamasini bermaganmiz, shu uchun u sahifadagi
         * `<script type="application/ld+json">` ichidagi Product'ni
         * ishlatadi. Shuning uchun `open()` dan OLDIN schema'ni yangi
         * mahsulot bilan to'ldiramiz.
         */
        function openTryOn(product) {
          if (!widgetReady) {
            pendingProduct = product;
            setStatus('', 'Widget tayyorlanmoqda, biroz kuting…');
            return;
          }
          try {
            var data = JSON.parse(schemaEl.textContent);
            data.name = product.title;
            data.image = product.image;
            data.sku = product.id;
            data.offers.price = String(product.price);
            data.offers.priceCurrency = product.currency || 'UZS';
            if (product.store && product.store.name) {
              data.brand = { '@type': 'Brand', name: product.store.name };
            }
            schemaEl.textContent = JSON.stringify(data);

            window.DecartWidget.open({ mobileCamera: 'user' });
          } catch (e) {
            setStatus('err', 'Xatolik: ' + (e && e.message ? e.message : e));
          }
        }

        function renderProduct(p) {
          var card = document.createElement('div');
          card.className = 'card';

          var thumb = document.createElement('div');
          thumb.className = 'thumb';
          var img = document.createElement('img');
          img.loading = 'lazy';
          img.src = p.image;
          img.alt = p.title;
          thumb.appendChild(img);

          card.appendChild(thumb);

          var meta = document.createElement('div');
          meta.className = 'meta';

          var title = document.createElement('div');
          title.className = 'title';
          title.textContent = p.title;
          meta.appendChild(title);

          if (p.store && p.store.name) {
            var store = document.createElement('div');
            store.className = 'store';
            store.textContent = p.store.name;
            meta.appendChild(store);
          }

          var price = document.createElement('div');
          price.className = 'price';
          price.textContent = money(p.price, p.currency);
          meta.appendChild(price);

          var cta = document.createElement('button');
          cta.className = 'cta';
          cta.type = 'button';
          cta.textContent = p.canTryOn ? 'Kiyib ko‘rish' : 'Try-on mavjud emas';
          cta.disabled = !p.canTryOn;
          if (p.canTryOn) {
            cta.addEventListener('click', function () {
              openTryOn(p);
            });
          }
          meta.appendChild(cta);

          card.appendChild(meta);
          return card;
        }

        function renderProducts(list) {
          grid.innerHTML = '';
          if (!list || list.length === 0) {
            var empty = document.createElement('div');
            empty.className = 'empty';
            empty.textContent = 'Hozircha mahsulot yo‘q';
            grid.appendChild(empty);
            return;
          }
          var frag = document.createDocumentFragment();
          list.forEach(function (p) {
            frag.appendChild(renderProduct(p));
          });
          grid.appendChild(frag);
        }

        async function loadProducts() {
          try {
            var res = await fetch(API, { credentials: 'omit' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            var json = await res.json();
            var items = (json && json.data) || [];
            // Try-on bor mahsulotlar oldinroq
            items.sort(function (a, b) {
              return (b.canTryOn ? 1 : 0) - (a.canTryOn ? 1 : 0);
            });
            renderProducts(items);
            setStatus(
              'ok',
              items.length + " ta mahsulot — kiyimni bosib o'zingizda ko'ring",
            );
          } catch (e) {
            setStatus('err', 'Mahsulotlarni yuklab bo‘lmadi: ' + (e.message || e));
          }
        }

        waitForWidget();
        loadProducts();
      })();
    </script>
  </body>
</html>
