<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0A0812" />
    <title>LookSave — Real-time try-on</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #fbf7ff;
        color: #0a0812;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          'Inter',
          system-ui,
          sans-serif;
      }
      body {
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #mount {
        min-height: 100vh;
        padding: 16px;
      }
      .fallback {
        text-align: center;
        padding: 64px 20px;
        color: #6b7280;
      }
      .fallback h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 700;
        color: #0a0812;
      }
      .fallback p {
        margin: 0;
        font-size: 14px;
      }
      .spinner {
        display: inline-block;
        width: 28px;
        height: 28px;
        margin-bottom: 20px;
        border: 3px solid #e9d5ff;
        border-top-color: #8b2cf5;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="mount">
      <div class="fallback" id="fallback">
        <div class="spinner" aria-hidden="true"></div>
        <h1>Real-time try-on yuklanmoqda…</h1>
        <p>Widget 5–10 soniyada ishga tushadi.</p>
      </div>
    </div>
    <!--
      Decart Anywear widget. `domain=looksave.uz` — hisobga bog'langan
      domain. Script sahifa yuklanishini to'xtatmaslik uchun `async`.
    -->
    <script
      src="https://anywear.decart.ai/widget/latest/anywear.js?domain=looksave.uz"
      async
    ></script>
  </body>
</html>
