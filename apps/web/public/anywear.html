<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0A0812" />
    <title>LookSave — Real-time try-on</title>
    <!-- cache-buster 2026-11-18T11:40Z: force Vercel to redeploy with onlyTryon filter -->

    <!--
      ⚠️ JSON-LD PRODUCT SCHEMA SHART. Decart Anywear widget'i tugmani
      faqat `isProductPage` true qaytargan sahifada ko'rsatadi
      (anywear.js ichida `<script type="application/ld+json">` ichidagi
      `@type: "Product"` yoki `"ProductGroup"` izlanadi). Schema'ni
      mahsulot bosilganda JavaScript bilan yangilaymiz — Decart
      try-on uchun shu rasmni ishlatadi.
    -->
    <script id="__product_schema" type="application/ld+json">
      {
        "@context": "https://schema.org/",
        "@type": "Product",
        "name": "LookSave Try-on",
        "image": "https://www.looksave.uz/og-tryon.jpg",
        "description": "Real-time try-on — kiyimni kamera orqali ko'ring",
        "sku": "LS-TRYON-DEFAULT",
        "brand": { "@type": "Brand", "name": "LookSave" },
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "UZS",
          "availability": "https://schema.org/InStock"
        }
      }
    </script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #fbf7ff;
        color: #0a0812;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          'Inter',
          system-ui,
          sans-serif;
      }
      body {
        padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
      }
      header {
        padding: 18px 16px 10px;
        text-align: center;
      }
      header h1 {
        margin: 0 0 4px;
        font-size: 22px;
        font-weight: 800;
        color: #0a0812;
        letter-spacing: -0.01em;
      }
      header p {
        margin: 0;
        font-size: 13px;
        color: #6b7280;
      }

      .status {
        margin: 0 16px 10px;
        padding: 10px 14px;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 2px 10px rgba(139, 44, 245, 0.06);
        font-size: 13px;
        color: #6b7280;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .status.ok {
        background: #ecfdf5;
        color: #065f46;
      }
      .status.err {
        background: #fef2f2;
        color: #991b1b;
      }
      /* `display: flex` brauzerning `[hidden]` qoidasini bosib qo'yadi — qaytaramiz */
      [hidden] {
        display: none !important;
      }
      .status .retry {
        margin-inline-start: auto;
        flex-shrink: 0;
        appearance: none;
        border: 1px solid currentColor;
        background: transparent;
        color: inherit;
        font: inherit;
        font-weight: 600;
        padding: 6px 12px;
        border-radius: 999px;
        cursor: pointer;
      }

      /*
        `?embed=1` — mobil ilovadagi WebView. Sarlavha ilovaning o'z panelida
        turibdi; sahifada ikkinchi marta chiqmasin.
      */
      .embed header {
        padding-top: 14px;
      }
      .embed header h1 {
        display: none;
      }
      .embed header p {
        font-size: 14px;
      }

      .spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid #e9d5ff;
        border-top-color: #8b2cf5;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        flex-shrink: 0;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /*
        ⚠️ IKKI USTUNLI PANJARA. Mobil ekranda (odatiy ishlatuvchi)
        rasm katta ko'rinsin — ikki ustun eng mos: kiyim shakli
        ajralib turadi, scroll kam bo'ladi.
      */
      .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        padding: 10px 16px 120px;
      }
      @media (min-width: 640px) {
        .grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      @media (min-width: 900px) {
        .grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }

      .card {
        position: relative;
        background: #fff;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 4px 16px rgba(10, 8, 18, 0.06);
        display: flex;
        flex-direction: column;
      }
      .card .thumb {
        position: relative;
        aspect-ratio: 3 / 4;
        background: #f3e8ff;
        overflow: hidden;
      }
      .card .thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .card .badge {
        position: absolute;
        top: 8px;
        left: 8px;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 8px;
        background: rgba(139, 44, 245, 0.95);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        border-radius: 999px;
        letter-spacing: 0.02em;
      }
      .card .meta {
        padding: 10px 12px 12px;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .card .title {
        font-size: 13px;
        font-weight: 600;
        color: #0a0812;
        line-height: 1.3;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .card .store {
        font-size: 11px;
        color: #9ca3af;
      }
      .card .price {
        font-size: 14px;
        font-weight: 700;
        color: #8b2cf5;
      }
      .card .cta {
        margin-top: 4px;
        appearance: none;
        border: none;
        background: #0a0812;
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        padding: 10px 12px;
        border-radius: 10px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition:
          background 0.15s ease,
          transform 0.08s ease;
      }
      .card .cta:hover {
        background: #8b2cf5;
      }
      .card .cta:active {
        transform: scale(0.98);
      }
      .card .cta[disabled] {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .empty {
        grid-column: 1 / -1;
        padding: 60px 20px;
        text-align: center;
        color: #9ca3af;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <!--
      Matnlar pastdagi skriptda, sahifa tiliga qarab yoziladi (`TEXT`).
      Bu yerdagi qiymatlar — skript ishlaguncha ko'rinadigan bo'sh joy.
    -->
    <header>
      <h1 id="page-title">Live try-on</h1>
      <p id="page-sub"></p>
    </header>

    <div class="status" id="status" role="status">
      <span class="spinner" id="status-spinner" aria-hidden="true"></span>
      <span id="status-text"></span>
      <button type="button" class="retry" id="status-retry" hidden></button>
    </div>

    <div class="grid" id="grid"></div>

    <!--
      Decart Anywear widget. `domain=looksave.uz` — hisobga bog'langan
      domain. Script sahifa yuklanishini to'xtatmaslik uchun `async`.
    -->
    <script
      src="https://anywear.decart.ai/widget/latest/anywear.js?domain=looksave.uz"
      async
    ></script>

    <script>
      (function () {
        'use strict';

        /*
         * ⚠️ SAHIFA ILOVA TILIDA CHIQADI (2026-11-18).
         *
         * Ilgari hamma matn o'zbekcha edi: inglizcha telefonda ilovaning
         * paneli «Live try-on» deb, ostidagi sahifa esa o'zbekcha chiqardi.
         * Mobil ilova tilni `?lang=` bilan uzatadi
         * (`apps/mobile/app/anywear.tsx`); to'g'ridan-to'g'ri brauzerda
         * ochilsa brauzer tiliga qaraladi. To'rt til — ilova va sayt bilan
         * bir xil: uz, ru, en, ar. Notanish til — inglizcha.
         *
         * Yangi matn qo'shsangiz TO'RTTALA tilga qo'shing: kalit topilmasa
         * ekranda `undefined` chiqadi.
         */
        var TEXT = {
          uz: {
            title: "LookSave — Real vaqtda kiyib ko'rish",
            heading: "Real vaqtda kiyib ko'rish",
            sub: "Kiyimni tanlang va kamera orqali o'zingizda ko'ring",
            loading: 'Vidjet va mahsulotlar yuklanmoqda…',
            ready: "{n} ta mahsulot — bosing va o'zingizda ko'ring",
            cta: "Kiyib ko'rish",
            empty: "Hozircha kiyib ko'rsa bo'ladigan mahsulot yo'q",
            loadFailed: "Mahsulotlarni yuklab bo'lmadi. Internetni tekshirib, qayta urinib ko'ring.",
            retry: 'Qayta urinish',
            widgetWait: 'Vidjet tayyorlanmoqda, biroz kuting…',
            widgetFailed: 'Vidjet yuklanmadi. Internetni tekshirib, sahifani qayta oching.',
            openFailed: "Kiyib ko'rishni ochib bo'lmadi. Qayta urinib ko'ring.",
          },
          ru: {
            title: 'LookSave — Примерка в реальном времени',
            heading: 'Примерка в реальном времени',
            sub: 'Выберите вещь и примерьте её через камеру',
            loading: 'Загружаем виджет и товары…',
            ready: 'Товаров: {n} — нажмите, чтобы примерить',
            cta: 'Примерить',
            empty: 'Пока нет товаров для примерки',
            loadFailed: 'Не удалось загрузить товары. Проверьте интернет и попробуйте ещё раз.',
            retry: 'Повторить',
            widgetWait: 'Виджет готовится, подождите…',
            widgetFailed: 'Виджет не загрузился. Проверьте интернет и откройте страницу заново.',
            openFailed: 'Не удалось открыть примерку. Попробуйте ещё раз.',
          },
          en: {
            title: 'LookSave — Live try-on',
            heading: 'Live try-on',
            sub: 'Pick an item and see it on yourself through the camera',
            loading: 'Loading the widget and products…',
            ready: '{n} items — tap one to try it on',
            cta: 'Try on',
            empty: 'No items are available for live try-on yet',
            loadFailed: 'Couldn’t load products. Check your connection and try again.',
            retry: 'Try again',
            widgetWait: 'Getting the widget ready, one moment…',
            widgetFailed: 'The try-on widget didn’t load. Check your connection and reopen this page.',
            openFailed: 'Couldn’t open the try-on. Please try again.',
          },
          ar: {
            title: 'LookSave — تجربة مباشرة',
            heading: 'تجربة مباشرة',
            sub: 'اختر قطعة وشاهدها عليك عبر الكاميرا',
            loading: 'جارٍ تحميل الأداة والمنتجات…',
            ready: 'عدد المنتجات: {n} — اضغط على أي منها لتجربته',
            cta: 'جرّب الآن',
            empty: 'لا توجد منتجات متاحة للتجربة المباشرة حاليًا',
            loadFailed: 'تعذّر تحميل المنتجات. تحقق من اتصالك وحاول مرة أخرى.',
            retry: 'إعادة المحاولة',
            widgetWait: 'جارٍ تجهيز الأداة، لحظة من فضلك…',
            widgetFailed: 'تعذّر تحميل أداة التجربة. تحقق من اتصالك وأعد فتح الصفحة.',
            openFailed: 'تعذّر فتح التجربة. حاول مرة أخرى.',
          },
        };

        var params = new URLSearchParams(window.location.search);

        function pickLang() {
          var wanted = String(params.get('lang') || navigator.language || 'en')
            .toLowerCase()
            .slice(0, 2);
          return Object.prototype.hasOwnProperty.call(TEXT, wanted) ? wanted : 'en';
        }

        var lang = pickLang();
        var T = TEXT[lang];

        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        document.title = T.title;
        document.getElementById('page-title').textContent = T.heading;
        document.getElementById('page-sub').textContent = T.sub;
        if (params.get('embed') === '1') document.body.classList.add('embed');

        /*
         * ⚠️ FAQAT KIYIB KO'RSA BO'LADIGAN MAHSULOTLAR (`onlyTryon=true`).
         *
         * Ilgari sahifa eng yangi 24 mahsulotni olardi. 2026-11-18 da ular
         * hammasi sumka edi (`canTryOn: false`) va sahifa boshdan-oyoq
         * o'chiq «Try-on mavjud emas» tugmalaridan iborat chiqdi — holbuki
         * katalogda 69 ta mos mahsulot bor edi, shunchaki ro'yxatning
         * keyingi sahifalarida. Endi filtrni server qo'yadi va javob
         * sahifalari oxirigacha (`MAX_PAGES` gacha) o'qiladi.
         *
         * Kalit yo'q: `/products` ochiq endpoint, autentifikatsiya talab
         * qilmaydi (katalog web va mobile ikkalasida ishlatiladi).
         */
        var API = 'https://api.looksave.uz/v1/products';
        var PAGE_SIZE = 50; // serverning yuqori chegarasi
        var MAX_PAGES = 3;

        /*
         * Old kamera gavdaning yuqori qismini ko'radi: avval ustki kiyim,
         * keyin shim, oxirida poyabzal. Guruh ichida server tartibi
         * (yangisi oldin) saqlanadi.
         */
        var SLOT_RANK = { outer: 0, top: 0, bottom: 1, feet: 2 };

        function slotRank(product) {
          var rank = SLOT_RANK[product.slot];
          return rank === undefined ? 3 : rank;
        }

        var statusEl = document.getElementById('status');
        var statusText = document.getElementById('status-text');
        var statusSpinner = document.getElementById('status-spinner');
        var statusRetry = document.getElementById('status-retry');
        var grid = document.getElementById('grid');
        var schemaEl = document.getElementById('__product_schema');
        var widgetReady = false;
        var widgetFailed = false;
        var pendingProduct = null;
        /** Mahsulotlar yuklangach ko'rsatiladigan qator — vidjet xabaridan keyin shunga qaytamiz */
        var readyText = '';

        statusRetry.textContent = T.retry;
        statusRetry.addEventListener('click', function () {
          void loadProducts();
        });

        /*
         * Mobil ilovadagi `money()` bilan bir xil (`apps/mobile/src/theme/format.ts`):
         * mingliklar bo'sh joy bilan. `toLocaleString('uz-UZ')` brauzerga qarab
         * goh «1 200 000», goh «1,200,000» berardi.
         */
        function money(price, currency) {
          if (price === null || price === undefined || price === '') return '';
          var whole = String(price).split('.')[0];
          if (!/^\d+$/.test(whole)) return '';
          var grouped = whole.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
          return !currency || currency === 'UZS' ? grouped + " so'm" : grouped + ' ' + currency;
        }

        /** `kind`: '' — kutish (aylanuvchi belgi), 'ok' yoki 'err'. */
        function setStatus(kind, text, withRetry) {
          statusEl.hidden = false;
          statusEl.className = 'status' + (kind ? ' ' + kind : '');
          statusText.textContent = text;
          statusSpinner.hidden = kind !== '';
          statusRetry.hidden = !withRetry;
        }

        /*
         * Widget tayyor bo'lguncha kutamiz — `DecartWidget.open()` mavjud
         * bo'lsa ishga tushdi hisoblanadi. Agar foydalanuvchi widget
         * yuklanishdan oldin kartani bossa, pendingProduct'ga saqlab
         * tayyor bo'lgach ochamiz.
         */
        function waitForWidget() {
          var tries = 0;
          var iv = setInterval(function () {
            tries++;
            if (window.DecartWidget && typeof window.DecartWidget.open === 'function') {
              widgetReady = true;
              clearInterval(iv);
              if (pendingProduct) {
                var p = pendingProduct;
                pendingProduct = null;
                openTryOn(p);
              }
            } else if (tries > 60) {
              clearInterval(iv);
              widgetFailed = true;
              pendingProduct = null;
              setStatus('err', T.widgetFailed);
            }
          }, 500);
        }

        /*
         * ⚠️ MAHSULOT → JSON-LD → DECART. Decart widget init paytida bir
         * marta `getGarmentMeta`ni chaqirib schema'ni o'qiydi. Biz uning
         * `getGarmentMeta` sozlamasini bermaganmiz, shu uchun u sahifadagi
         * `<script type="application/ld+json">` ichidagi Product'ni
         * ishlatadi. Shuning uchun `open()` dan OLDIN schema'ni yangi
         * mahsulot bilan to'ldiramiz.
         */
        function openTryOn(product) {
          if (widgetFailed) {
            setStatus('err', T.widgetFailed);
            return;
          }
          if (!widgetReady) {
            pendingProduct = product;
            setStatus('', T.widgetWait);
            return;
          }
          try {
            var data = JSON.parse(schemaEl.textContent);
            data.name = product.title;
            data.image = product.image;
            data.sku = product.id;
            data.offers.price = String(product.price);
            data.offers.priceCurrency = product.currency || 'UZS';
            if (product.store && product.store.name) {
              data.brand = { '@type': 'Brand', name: product.store.name };
            }
            schemaEl.textContent = JSON.stringify(data);

            window.DecartWidget.open({ mobileCamera: 'user' });
            // «Tayyorlanmoqda…» yozuvi ochilgandan keyin osilib qolmasin
            if (readyText) setStatus('ok', readyText);
          } catch (e) {
            // Xom xato matni odamga hech narsa demaydi — tafsiloti konsolda
            console.error('[anywear] kiyib ko`rish ochilmadi', e);
            setStatus('err', T.openFailed);
          }
        }

        function renderProduct(p) {
          var card = document.createElement('div');
          card.className = 'card';

          var thumb = document.createElement('div');
          thumb.className = 'thumb';
          var img = document.createElement('img');
          img.loading = 'lazy';
          img.src = p.image;
          img.alt = p.title;
          thumb.appendChild(img);

          card.appendChild(thumb);

          var meta = document.createElement('div');
          meta.className = 'meta';

          var title = document.createElement('div');
          title.className = 'title';
          title.textContent = p.title;
          meta.appendChild(title);

          if (p.store && p.store.name) {
            var store = document.createElement('div');
            store.className = 'store';
            store.textContent = p.store.name;
            meta.appendChild(store);
          }

          /*
           * ⚠️ NARX ALOHIDA `<bdi dir="ltr">` ICHIDA. Arabchada (o'ngdan chapga)
           * bo'sh joy bilan ajratilgan raqam guruhlari teskari tartibda chizilardi:
           * «2 000 000 so'm» ekranda «so'm 000 000 2» bo'lib chiqardi.
           */
          var price = document.createElement('div');
          price.className = 'price';
          var amount = document.createElement('bdi');
          amount.dir = 'ltr';
          amount.textContent = money(p.price, p.currency);
          price.appendChild(amount);
          meta.appendChild(price);

          // Ro'yxatda faqat kiyib ko'rsa bo'ladiganlar bor — o'chiq tugma yo'q
          var cta = document.createElement('button');
          cta.className = 'cta';
          cta.type = 'button';
          cta.textContent = T.cta;
          cta.addEventListener('click', function () {
            openTryOn(p);
          });
          meta.appendChild(cta);

          card.appendChild(meta);
          return card;
        }

        function renderProducts(list) {
          grid.innerHTML = '';
          if (list.length === 0) {
            var empty = document.createElement('div');
            empty.className = 'empty';
            empty.textContent = T.empty;
            grid.appendChild(empty);
            return;
          }
          var frag = document.createDocumentFragment();
          list.forEach(function (p) {
            frag.appendChild(renderProduct(p));
          });
          grid.appendChild(frag);
        }

        async function fetchPage(cursor) {
          var url =
            API +
            '?onlyTryon=true&limit=' +
            PAGE_SIZE +
            (cursor ? '&cursor=' + encodeURIComponent(cursor) : '');
          var res = await fetch(url, { credentials: 'omit' });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        }

        async function loadProducts() {
          setStatus('', T.loading);
          try {
            var items = [];
            var cursor = null;
            for (var page = 0; page < MAX_PAGES; page++) {
              var json = await fetchPage(cursor);
              items = items.concat((json && json.data) || []);
              var meta = (json && json.meta) || {};
              if (!meta.hasMore || !meta.nextCursor) break;
              cursor = meta.nextCursor;
            }

            // Filtrni server qo'yadi; bu — u filtrni tanimay qolsa ham
            // sahifada kiyib bo'lmaydigan mahsulot chiqmasligi uchun.
            var ordered = items
              .filter(function (p) {
                return p && p.canTryOn;
              })
              .map(function (p, index) {
                return { p: p, index: index };
              })
              .sort(function (a, b) {
                return slotRank(a.p) - slotRank(b.p) || a.index - b.index;
              })
              .map(function (entry) {
                return entry.p;
              });

            renderProducts(ordered);
            if (ordered.length === 0) {
              // Bo'sh holat matni panjaraning o'zida — ustidagi qator ortiqcha
              readyText = '';
              statusEl.hidden = true;
              return;
            }
            readyText = T.ready.replace('{n}', String(ordered.length));
            // Vidjet yuklanmagani haqidagi xabarni «tayyor» bilan bosib ketmaymiz
            if (!widgetFailed) setStatus('ok', readyText);
          } catch (e) {
            console.error('[anywear] mahsulotlar yuklanmadi', e);
            setStatus('err', T.loadFailed, true);
          }
        }

        waitForWidget();
        void loadProducts();
      })();
    </script>
  </body>
</html>
