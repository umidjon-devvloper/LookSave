app = "facefusion"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  FACEFUSION_TIMEOUT_S = "300"

[mounts]
  source = "facefusion_models"
  destination = "/app/facefusion/.assets"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 2
    soft_limit = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "8gb"
  cpu_kind = "performance"
  cpus = 4
