name: Deploy API

# Faqat qo'lda ishga tushiriladi yoki `main` ga API o'zgarishi tushganda.
# ⚠️ Ishlashi uchun quyidagi secret'lar kerak:
#   VPS_HOST · VPS_USER · VPS_SSH_KEY
# Ular sozlanmaguncha workflow'ni qo'lda ishga tushirmang.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'infra/**'
      - '.github/workflows/api.yml'

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }

      - run: npm ci

      # Deploy qilinayotgan kod sinovdan o'tgan bo'lishi shart
      - run: npm run typecheck
      - run: npm run test --workspace=apps/api

      - id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/looksave-api:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/looksave-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: VPS'da almashtirish
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /home/deploy/looksave
            git pull --ff-only

            cd infra
            # Migratsiyadan oldin backup — migratsiya orqaga qaytmaydi
            ./scripts/backup.sh
            ./scripts/migrate.sh

            # deploy.sh o'zi health kutadi va muvaffaqiyatsizlikda yiqiladi
            ./scripts/deploy.sh ${{ needs.build.outputs.tag }}
